# 无人机网络安全防御系统 - 默认配置
# Drone Security Defense System - Default Configuration

version: "1.0.0"
log_level: "INFO"
log_path: "logs/"

# 平台配置
platform:
  auto_detect: true
  resource_profile: "balanced"  # minimal, balanced, full
  name: ""

# 检测器配置
detectors:
  mavlink:
    enabled: true
    interval: 0.1  # 检测间隔（秒）
    rules:
      - message_sequence_check
      - system_id_validation
      - command_whitelist
    settings:
      max_message_gap: 10
      allowed_system_ids: [1, 255]
      allowed_component_ids: [1, 50, 190, 191, 192]
      allowed_commands: []

  gps:
    enabled: true
    interval: 0.5
    rules:
      - position_jump_detection
      - velocity_constraint
      - signal_quality_check
      - time_sync_validation
    settings:
      max_jump_distance: 1000  # 米
      max_acceleration: 10.0   # m/s²
      min_satellites: 6
      max_velocity_mismatch: 5.0  # m/s

  sensor:
    enabled: true
    interval: 0.1
    rules:
      - data_range_validation
      - sensor_consistency
      - noise_pattern_check
    settings:
      temperature_range: [-40, 85]
      pressure_range: [300, 1100]  # hPa
      imu_max_rate: 1000.0  # rad/s

  dos:
    enabled: true
    interval: 1.0
    settings:
      max_connections_per_second: 10
      max_connections_per_minute: 100
      max_requests_per_second: 50
      block_duration: 300  # 秒

  firmware:
    enabled: false
    interval: 3600  # 秒
    settings:
      check_interval: 3600  # 秒
      firmware_path: "/path/to/firmware.bin"
      expected_hash: ""
      signature_required: false
      signature_path: ""
      public_key_path: ""

# 分析器配置
analyzers:
  statistical:
    enabled: true
    window_size: 100
    outlier_threshold: 3.0
    outlier_method: "zscore"  # zscore 或 iqr

  correlation:
    enabled: true
    time_window: 30.0  # 秒

  ml:
    enabled: false
    model_path: ""
    confidence_threshold: 0.7

# 告警配置
alerts:
  enabled: true
  handlers:
    - type: "console"
    - type: "log"
      level: "INFO"
    - type: "file"
      path: "logs/alerts.log"

  severity_levels:
    low:
      cooldown: 60  # 秒
    medium:
      cooldown: 30
    high:
      cooldown: 10
      immediate: true
    critical:
      cooldown: 0
      immediate: true

# 阻断配置
blocking:
  enabled: false
  auto_block: false  # 自动阻断（谨慎启用）
  block_threshold: 3  # 触发自动阻断的违规次数
  block_duration: 300  # 秒

# 云端配置
cloud:
  enabled: false
  endpoint: "https://api.drone-security.com/v1"
  api_key: "${CLOUD_API_KEY}"
  sync_interval: 300
  offline_cache: true
  cache_path: "logs/cloud_cache.json"

# 接口配置
interfaces:
  mavlink:
    enabled: false
    connection_string: "serial:///dev/ttyACM0:57600"

  gps:
    enabled: false
    connection_string: "ntrip://username:password@caster.host:port"

  network:
    enabled: false
    host: "0.0.0.0"
    port: 14550
    protocol: "udp"  # tcp 或 udp

# Web服务器配置
web:
  enabled: true
  host: "0.0.0.0"
  port: 8080
  debug: false
  log_level: "info"
  cors_origins: ["*"]

  # 静态文件
  static_files: "src/frontend/dist"

  # WebSocket
  websocket:
    enabled: true
    ping_interval: 30

  # 广播器
  broadcaster:
    enabled: true
    interval: 5.0  # 秒

  # 认证（可选）
  auth:
    enabled: false
